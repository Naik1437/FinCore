# FinCore Production Nginx Reverse Proxy with TLS Configuration
# Free self-signed or Let's Encrypt TLS termination for zero-cost deployment

events {
    worker_connections 1024;
}

http {
    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    map_hash_bucket_size 128;
    include /etc/nginx/certs/gate_map.conf;

    # Upstream services
    upstream api_backend {
        server api:4000;
        keepalive 32;
    }

    upstream web_frontend {
        server web:3000;
        keepalive 32;
    }

    upstream analytics_backend {
        server analytics:8000;
        keepalive 16;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Production Server
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS Certificates (Free self-signed in dev, Let's Encrypt in prod)
        ssl_certificate /etc/nginx/certs/fincore.crt;
        ssl_certificate_key /etc/nginx/certs/fincore.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Demo Gate: Basic Auth exchanges credentials for an HttpOnly Secure session cookie
        location = /_gate {
            auth_basic "FinCore Protected Demo";
            auth_basic_user_file /etc/nginx/certs/.htpasswd;
            # try_files enters the access phase, so auth_basic runs before the redirect.
            try_files /__fincore_gate_authentication_marker__ @fincore_gate_authenticated;
        }

        location @fincore_gate_authenticated {
            include /etc/nginx/certs/gate_set_cookie.conf;
            return 302 /;
        }

        # Web Frontend
        location / {
            if ($demo_gate_ok = 0) {
                return 302 /_gate;
            }
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Express API & Swagger UI Docs
        location /api/ {
            if ($demo_gate_ok = 0) {
                return 401;
            }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /docs {
            if ($demo_gate_ok = 0) {
                return 401;
            }
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            if ($demo_gate_ok = 0) {
                return 401;
            }
            proxy_pass http://api_backend;
            access_log off;
        }
    }
}
