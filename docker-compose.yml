services:
  postgres:
    image: postgres:17
    container_name: fincore-postgres
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fincore-postgres-data:/var/lib/postgresql/data
    networks:
      - fincore-network

  redis:
    image: redis:7
    container_name: fincore-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - fincore-redis-data:/data
    networks:
      - fincore-network

networks:
  fincore-network:
    external: true

volumes:
  fincore-postgres-data:
    external: true
  fincore-redis-data:
    external: true
